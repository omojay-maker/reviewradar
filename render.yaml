services:
  - type: web
    name: reviewradar
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 10000
      - key: AUTO_MIGRATE
        value: true
      - key: APP_ENV
        value: production
      - key: APP_CORS_ORIGIN
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 3600
      - key: DATABASE_URL
        fromDatabase:
          name: reviewradar-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT
        value: 30
      - key: GROQ_CONCURRENCY
        value: 5
      - key: PDFTOTEXT_BIN
        value: /usr/bin/pdftotext

databases:
  - name: reviewradar-db
    databaseName: reviewradar
    user: reviewradar
    plan: free
    region: frankfurt
